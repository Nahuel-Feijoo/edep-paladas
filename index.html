<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDEP - Cronómetro & Cadencia (3 Paladas / 2 Toques)</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #f0f6fc;
      --text-muted: #8b949e;
      --accent-green: #238636;
      --accent-orange: #d97706;
      --accent-blue: #1f6feb;
      --accent-red: #da3633;
      --highlight: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px;
      justify-content: space-between;
    }

    .header-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .section-title-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .btn-reset-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 6px;
    }
    .btn-reset-icon:active {
      color: var(--accent-red);
    }

    .timer-display {
      font-family: monospace;
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-color);
      letter-spacing: -1px;
    }

    .timer-controls {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn-small {
      flex: 1;
      padding: 6px 0;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      color: white;
    }

    .btn-start { background-color: var(--accent-green); }
    .btn-pause { background-color: var(--accent-orange); }
    .btn-reset { background-color: var(--border-color); color: var(--text-color); }

    .speed-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .speed-display {
      font-family: monospace;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--highlight);
    }

    .cadence-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex-grow: 1;
      justify-content: space-between;
    }

    .ppm-display-container {
      text-align: center;
      width: 100%;
    }

    .ppm-value {
      font-size: 3.8rem;
      font-weight: 900;
      line-height: 1;
      color: #ffffff;
    }

    .ppm-unit {
      font-size: 1rem;
      font-weight: 700;
      color: var(--highlight);
    }

    .history-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      min-height: 85px;
    }

    .history-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .history-item {
      font-size: 0.82rem;
      display: flex;
      justify-content: space-between;
      color: var(--text-color);
      font-weight: 600;
    }

    .history-item:first-child {
      color: var(--highlight);
      font-weight: 800;
    }

    .paddle-btn {
      width: 100%;
      height: 140px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--accent-blue), #0b4fbf);
      color: white;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(31, 111, 235, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .paddle-btn.active-cycle {
      background: linear-gradient(135deg, var(--accent-orange), #b45309);
      box-shadow: 0 8px 20px rgba(217, 119, 6, 0.4);
    }

    .paddle-subtext {
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0.85;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- 1. CRONÓMETRO GENERAL -->
  <header class="header-section">
    <div class="section-title">Tiempo Transcurrido</div>
    <div class="timer-display" id="timer">00:00:00</div>
    <div class="timer-controls">
      <button class="btn-small btn-start" id="btn-timer-start">INICIAR</button>
      <button class="btn-small btn-reset" id="btn-timer-reset">REINICIAR</button>
    </div>
  </header>

  <!-- 2. VELOCIDAD GPS -->
  <section class="speed-section">
    <div class="section-title">Velocidad Actual</div>
    <div class="speed-display"><span id="speed-val">0.0</span> <span style="font-size: 0.9rem; color: var(--text-muted);">km/h</span></div>
  </section>

  <!-- 3. CALCULADORA DE CADENCIA -->
  <main class="cadence-section">
    <div class="ppm-display-container">
      <div class="section-title-container">
        <span class="section-title">Frecuencia de Paladas</span>
        <button class="btn-reset-icon" id="btn-reset-ppm" title="Reiniciar paladas">↺ Borrar</button>
      </div>
      <div class="ppm-value" id="ppm-val">--</div>
      <div class="ppm-unit">PALADAS / MINUTO</div>
    </div>

    <!-- HISTORIAL DE ÚLTIMAS 5 MEDIDAS -->
    <div class="history-box">
      <div class="history-title">Últimas 5 mediciones (Ciclos de 3 paladas):</div>
      <ul class="history-list" id="history-list">
        <li style="color: var(--text-muted); font-size: 0.8rem;">Sin datos aún</li>
      </ul>
    </div>

    <button class="paddle-btn" id="btn-paddle">
      <span>TOCAR PALADA</span>
      <span class="paddle-subtext" id="btn-subtext">INICIAR (PALADA 1)</span>
    </button>
  </main>

  <script>
    function vibrate(ms = 40) {
      if ('vibrate' in navigator) {
        navigator.vibrate(ms);
      }
    }

    // --- 1. CRONÓMETRO GENERAL ---
    let timerInterval = null;
    let timerStartTime = 0;
    let timerElapsedTime = 0;
    let isTimerRunning = false;

    const timerDisplay = document.getElementById('timer');
    const btnTimerStart = document.getElementById('btn-timer-start');
    const btnTimerReset = document.getElementById('btn-timer-reset');

    function updateTimerDisplay() {
      const totalMs = timerElapsedTime + (isTimerRunning ? Date.now() - timerStartTime : 0);
      const mins = Math.floor(totalMs / 60000);
      const secs = Math.floor((totalMs % 60000) / 1000);
      const centis = Math.floor((totalMs % 1000) / 10);

      const format = (n) => String(n).padStart(2, '0');
      timerDisplay.textContent = `${format(mins)}:${format(secs)}:${format(centis)}`;
    }

    btnTimerStart.addEventListener('click', () => {
      vibrate(30);
      if (!isTimerRunning) {
        isTimerRunning = true;
        timerStartTime = Date.now();
        timerInterval = setInterval(updateTimerDisplay, 30);
        btnTimerStart.textContent = "PAUSAR";
        btnTimerStart.className = "btn-small btn-pause";
      } else {
        isTimerRunning = false;
        timerElapsedTime += Date.now() - timerStartTime;
        clearInterval(timerInterval);
        btnTimerStart.textContent = "CONTINUAR";
        btnTimerStart.className = "btn-small btn-start";
      }
    });

    btnTimerReset.addEventListener('click', () => {
      vibrate(50);
      isTimerRunning = false;
      clearInterval(timerInterval);
      timerElapsedTime = 0;
      updateTimerDisplay();
      btnTimerStart.textContent = "INICIAR";
      btnTimerStart.className = "btn-small btn-start";
    });

    // --- 2. GEOLOCALIZACIÓN ---
    const speedVal = document.getElementById('speed-val');

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          const speedMS = position.coords.speed;
          if (speedMS !== null && !isNaN(speedMS) && speedMS >= 0) {
            speedVal.textContent = (speedMS * 3.6).toFixed(1);
          } else {
            speedVal.textContent = "0.0";
          }
        },
        (error) => {
          speedVal.textContent = "0.0";
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    } else {
      speedVal.textContent = "N/D";
    }

    // --- 3. LÓGICA DE CADENCIA (2 TOQUES = 3 INTERVALOS DE PALADA) ---
    let paddleTouches = 0;
    let cycleStartTime = 0;
    let history = [];

    const btnPaddle = document.getElementById('btn-paddle');
    const btnSubtext = document.getElementById('btn-subtext');
    const ppmVal = document.getElementById('ppm-val');
    const historyList = document.getElementById('history-list');
    const btnResetPpm = document.getElementById('btn-reset-ppm');

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = '<li style="color: var(--text-muted); font-size: 0.8rem;">Sin datos aún</li>';
        return;
      }

      historyList.innerHTML = history.map((item, index) => `
        <li class="history-item">
          <span>#${history.length - index} • ${item.time}s (3 paladas)</span>
          <span>${item.ppm} PPM</span>
        </li>
      `).join('');
    }

    btnPaddle.addEventListener('click', () => {
      vibrate(60);
      paddleTouches++;

      if (paddleTouches === 1) {
        // 1er toque de la app = 1er palazo del palista en el agua
        cycleStartTime = performance.now();
        btnPaddle.classList.add('active-cycle');
        btnSubtext.textContent = "FINALIZAR (PALADA 4)";
      } else if (paddleTouches === 2) {
        // 2do toque de la app = 4to palazo del palista (transcurrieron 3 paladas completas)
        const cycleEndTime = performance.now();
        const durationSeconds = (cycleEndTime - cycleStartTime) / 1000;

        if (durationSeconds > 0) {
          // Cálculo correcto: 3 paladas completadas en este tiempo
          const ppm = Math.round((3 / durationSeconds) * 60);
          ppmVal.textContent = ppm;

          history.unshift({ ppm: ppm, time: durationSeconds.toFixed(2) });
          if (history.length > 5) {
            history.pop();
          }

          renderHistory();
        }

        paddleTouches = 0;
        btnPaddle.classList.remove('active-cycle');
        btnSubtext.textContent = "INICIAR (PALADA 1)";
      }
    });

    btnResetPpm.addEventListener('click', () => {
      vibrate(50);
      paddleTouches = 0;
      history = [];
      ppmVal.textContent = "--";
      btnPaddle.classList.remove('active-cycle');
      btnSubtext.textContent = "INICIAR (PALADA 1)";
      renderHistory();
    });
  </script>
</body>
</html>
